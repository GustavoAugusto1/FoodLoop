<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../fotos/FoodLoop Logo 2.png">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="login-container">
        <h2>Cadastro</h2>
        <form id="registerForm">
            <label for="fullName">Nome Completo</label>
            <input type="text" id="fullName" name="fullName" placeholder="Digite seu nome completo" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" autocomplete="email" required>
            
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>

            <label for="confirmPassword">Confirme a Senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirme sua senha" autocomplete="new-password" minlength="6" required>

            <label for="phone">Número de Telefone (com DDD)</label>
            <input type="tel" id="phone" name="phone" placeholder="(XX) XXXXX-XXXX" autocomplete="tel" required>

            <label for="cpfCnpj">CPF ou CNPJ</label>
            <input type="text" id="cpfCnpj" name="cpfCnpj" placeholder="Digite seu CPF ou CNPJ" inputmode="numeric" required>

            <label for="city">Cidade</label>
            <input type="text" id="city" name="city" placeholder="Digite sua cidade" autocomplete="address-level2" required>

            <label for="state">Estado</label>
            <input type="text" id="state" name="state" placeholder="UF" autocomplete="address-level1" maxlength="2" required>

            <label for="birthdate">Data de Nascimento</label>
            <input type="date" id="birthdate" name="birthdate" autocomplete="bday" required>
            
            <button type="submit">Cadastrar</button>
            <p id="formMessage" class="form-message" role="alert"></p>
            <p class="login-link">Já possui conta? <a href="../telaLogin/index.html">Entrar</a></p>
        </form>
    </div>

    <script src="../shared/app.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
